
name: Build MLSS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MLSS_Android_Studio_Project_FINAL_ICON.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and Extract New Android Project ZIP
        run: |
          test -f MLSS_Android_Studio_Project_FINAL_ICON.zip
          unzip -q MLSS_Android_Studio_Project_FINAL_ICON.zip -d project
          test -f project/mlss_android/app/src/main/AndroidManifest.xml
          test -f project/mlss_android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          grep -q 'android:icon="@mipmap/ic_launcher"' project/mlss_android/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project/mlss_android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLSS-APK-with-selected-icon
          path: project/mlss_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
