name: Build MLSS Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -q MLSS_Android_Studio_Project.zip -d project

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd project
          find . -name gradlew -type f
          chmod +x $(find . -name gradlew -type f | head -1)
          cd $(dirname $(find . -name gradlew -type f | head -1))
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLSS-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
